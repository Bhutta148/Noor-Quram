<!doctype html>
<html lang="en" dir="ltr" data-theme="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e3b34">
<title>Noor Quran</title>
<meta name="description" content="Quran with Urdu and English translations, tafsir and recitation, ten hadith books, word-by-word meanings, Hifz, Qaida lessons and quizzes.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app bar on top, slide-in side menu, one reading column; the Quran reader adds a playback bar at the bottom */
:root{
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-quran:"Amiri Quran","Amiri","Scheherazade New","Traditional Arabic",serif;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
  --f-ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;
  --ar-size:28px; --tr-size:17px; --bar-min:56px; --bar-h:56px; --player-h:0px;
  /* Emerald theme (default) */
  --bg:#edf2ef; --surface:#ffffff; --surface2:#f5f8f6; --ink:#13241f; --muted:#56675f; --line:#d6e0db;
  --accent:#0f5b4f; --accent-ink:#ffffff; --gold:#9c6f1a; --hl:#dfeee7; --chip:#e6efeb;
  --bar:#0e3b34; --bar-ink:#f3ecd9; --bar-muted:#b7c8c1; --scrim:rgba(5,15,12,.48);
  --ok:#1d7a4c; --ok-bg:#e1f3e9; --warn:#9a5c06; --bad:#b3261e; --bad-bg:#fbe7e5;
  --toast-bg:#1b2925; --toast-ink:#f3efe4; --shadow:0 1px 2px rgba(10,30,25,.05),0 6px 18px rgba(10,30,25,.06);
  color-scheme:light;
}
:root[data-theme="night"]{--bg:#0b1312;--surface:#121c1a;--surface2:#172321;--ink:#e3ebe8;--muted:#93a59f;--line:#24332f;--accent:#62c3ad;--accent-ink:#06120f;--gold:#dab264;--hl:#16302a;--chip:#1a2a27;--bar:#08100e;--bar-ink:#eadfc4;--bar-muted:#8fa29c;--scrim:rgba(0,0,0,.62);--ok:#5cc690;--ok-bg:#12301f;--warn:#e3a84b;--bad:#ff8a80;--bad-bg:#3a1513;--toast-bg:#e9e3d2;--toast-ink:#13201c;--shadow:none;color-scheme:dark}
:root[data-theme="classic"]{--bg:#f5f6f8;--surface:#ffffff;--surface2:#f8f9fb;--ink:#17202a;--muted:#59656f;--line:#e0e5eb;--accent:#1c6aa0;--accent-ink:#ffffff;--gold:#8f651c;--hl:#e5eff8;--chip:#ecf1f6;--bar:#ffffff;--bar-ink:#17202a;--bar-muted:#59656f;--scrim:rgba(10,20,30,.42);--ok-bg:#e3f4ea;--bad-bg:#fbe8e6}
:root[data-theme="sepia"]{--bg:#f0e7d4;--surface:#fbf5e8;--surface2:#f6eedd;--ink:#3a2c1d;--muted:#73624b;--line:#e0d1b4;--accent:#7a4e1c;--accent-ink:#fff8ea;--gold:#96641a;--hl:#eee0c3;--chip:#efe4cc;--bar:#563917;--bar-ink:#f6ead1;--bar-muted:#d8c6a4;--scrim:rgba(40,25,10,.46);--ok-bg:#e9efd7;--bad-bg:#f6e0d6;--toast-bg:#3a2c1d;--toast-ink:#fbf5e8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:var(--bar-h)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-ui)}
html[lang="ur"] body{font-family:var(--f-ur);font-size:15px;line-height:2.15}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.svg{width:22px;height:22px;flex:none}
.svg.big{width:44px;height:44px;color:var(--accent)}
[dir="rtl"] .flip{transform:scaleX(-1)}
.muted{color:var(--muted)}
.pad{padding:24px 0;text-align:center}
.h2{margin:6px 2px 0;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.02em}
html[lang="ur"] .h2{font-size:15px;letter-spacing:0}
.lead{margin:0;color:var(--muted)}

/* App bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid rgba(127,127,127,.18)}
.appbar .in{display:flex;align-items:center;gap:4px;min-height:var(--bar-min);max-width:1000px;margin:0 auto;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.ib{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:inherit;flex:none;padding:0}
.ib:active{background:rgba(127,127,127,.16)}
.ib small{position:absolute;bottom:2px;font-size:10px;font-weight:700;line-height:1}
.ttl{flex:1;min-width:0;padding-inline:4px}
.ttl h1{margin:0;font-size:18px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{font-size:12px;color:var(--bar-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
html[lang="ur"] .ttl h1{font-size:17px;line-height:1.95;font-weight:600}
html[lang="ur"] .ttl .sub{line-height:1.8}
.baracts{display:flex}

/* Side menu */
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:40;width:min(86vw,320px);background:var(--surface);color:var(--ink);transform:translateX(-104%);transition:transform .22s ease;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 0 40px rgba(0,0,0,.28)}
[dir="rtl"] .drawer{transform:translateX(104%)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.scrim{position:fixed;inset:0;z-index:35;background:var(--scrim)}
.dr-head{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 16px;background:var(--bar);color:var(--bar-ink)}
.dr-head img{width:48px;height:48px;border-radius:12px}
.dr-head b{display:block;font-size:18px;line-height:1.4}
.dr-head span{display:block;font-family:var(--f-quran);color:var(--gold);font-size:18px;line-height:1.5}
:root[data-theme="classic"] .dr-head span{color:var(--gold)}
.dr-nav{display:flex;flex-direction:column;padding:8px;gap:2px}
.dr-nav a{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.dr-nav a .svg{color:var(--muted)}
.dr-nav a.on{background:var(--hl);color:var(--accent)}
.dr-nav a.on .svg{color:var(--accent)}
.dr-sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 12px 2px}
html[lang="ur"] .dr-sec{font-size:13px;letter-spacing:0}
.dr-foot{padding:12px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.dr-dua{margin:auto 12px 12px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);text-align:center}
.dr-dua-h{font-family:var(--f-ur);font-size:15px;line-height:2;color:var(--gold);font-weight:600}
.dr-dua ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.dr-dua li{font-family:var(--f-ur);font-size:15px;line-height:2.2;color:var(--ink)}
.dr-foot .seg{flex:1}
.dr-install{margin:0 12px 12px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}

/* Page column */
main{display:block}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(32px + var(--player-h) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
html[lang="ur"] .eyebrow{font-size:13px;letter-spacing:0}
.cardfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:6px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:3px 12px;font-size:13px;border-radius:10px;font-weight:600}
.btn.wide{width:100%}
.btn .svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:40px;padding:4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.sw{position:relative;width:48px;height:28px;border-radius:999px;border:0;background:var(--line);flex:none;padding:0}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.sw.on{background:var(--accent)}
.sw.on i{inset-inline-start:23px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
select,input[type="number"],input[type="search"],input[type="text"]{width:100%;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:15px}
input[type="range"]{width:100%;accent-color:var(--accent)}
.set{display:flex;flex-direction:column;gap:14px}
.set .h2{margin:0;color:var(--ink);font-size:16px}
.preview{padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px dashed var(--line)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.th{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:13px}
.th.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.th span{width:40px;height:28px;border-radius:8px;border:1px solid rgba(127,127,127,.3)}
.sw-auto{background:linear-gradient(135deg,#edf2ef 50%,#0b1312 50%)}
.sw-emerald{background:linear-gradient(#0e3b34 40%,#edf2ef 40%)}
.sw-night{background:linear-gradient(#08100e 40%,#172321 40%)}
.sw-classic{background:linear-gradient(#ffffff 40%,#f5f6f8 40%)}
.sw-sepia{background:linear-gradient(#563917 40%,#f0e7d4 40%)}

/* Home */
.hero{display:flex;flex-direction:column;gap:12px}
.salam{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 0 2px}
.salam .ar{font-family:var(--f-quran);font-size:30px;color:var(--gold);line-height:1.6}
.salam span:last-child{color:var(--muted);font-size:14px}
.searchbox{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);text-align:start;box-shadow:var(--shadow)}
.searchbox span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.searchbox .svg:last-child{color:var(--accent)}
.cont{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink)}
.cont-t{font-weight:600;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;text-align:center;line-height:1.3;min-width:0}
html[lang="ur"] .tile{font-size:13px;line-height:1.9;font-weight:400}
.tile .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--hl);color:var(--accent)}
.tile span:last-child{overflow-wrap:anywhere}
.install-card{display:flex;align-items:center;gap:12px}
.install-card div{flex:1;min-width:0}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.row .t{font-weight:600;line-height:1.4}
html[lang="ur"] .row .t{font-weight:600;line-height:1.95}
.row .s{font-size:12.5px;color:var(--muted);line-height:1.45;overflow:hidden;text-overflow:ellipsis}
html[lang="ur"] .row .s{line-height:1.9}
.row .arn{font-family:var(--f-quran);font-size:21px;color:var(--gold);flex:none;line-height:1.6}
.row .chev{color:var(--muted)}
.row .chev .svg{width:18px;height:18px}
.star{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);font-variant-numeric:tabular-nums;clip-path:polygon(50% 0%,66.5% 10.3%,85.4% 14.6%,89.7% 33.5%,100% 50%,89.7% 66.5%,85.4% 85.4%,66.5% 89.7%,50% 100%,33.5% 89.7%,14.6% 85.4%,10.3% 66.5%,0% 50%,10.3% 33.5%,14.6% 14.6%,33.5% 10.3%)}
html[lang="ur"] .star{font-family:var(--f-ui)}
.star.ic{background:var(--hl);color:var(--accent);clip-path:none;border-radius:12px}
.star.ic .svg{width:22px;height:22px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs a{flex:1;text-align:center;padding:8px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600}
.tabs a.on{background:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--ok);border:1px solid currentColor;border-radius:999px;padding:0 7px;margin-inline-start:6px;vertical-align:middle;line-height:1.6}
.minibar,.prog{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.minibar i,.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bigstat{font-size:30px;font-weight:700;color:var(--accent);line-height:1.3}
.bigstat span{font-size:14px;font-weight:500;color:var(--muted)}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
html[lang="ur"] .steps{list-style-type:urdu;padding-inline-start:26px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 18px}
.empty h2{margin:0;font-size:18px}
.empty p{margin:0}

/* Reader */
.rhead{text-align:center;display:flex;flex-direction:column;gap:2px;padding:6px 0}
.rhead .ar{font-family:var(--f-quran);font-size:36px;color:var(--gold);line-height:1.7}
.rhead h2{margin:0;font-size:20px;text-wrap:balance}
.rhead p{margin:0;color:var(--muted);font-size:13.5px}
.bism{font-family:var(--f-quran);font-size:28px;text-align:center;line-height:2;margin-top:4px}
.ayahs{display:flex;flex-direction:column;gap:12px}
.ayah{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--bar-h) + 14px);scroll-margin-bottom:calc(var(--player-h) + 14px)}
.ayah.on{border-color:var(--accent);background:var(--hl)}
.ayah.mem{border-inline-start:4px solid var(--ok)}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.vk{font-size:12.5px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-ui);min-width:0}
html[lang="ur"] .vk{font-family:var(--f-ur);font-size:13px}
.acts{display:flex;gap:0;flex:none}
.acts .ib{width:38px;height:38px;color:var(--muted);border-radius:10px}
.acts .ib .svg{width:20px;height:20px}
.acts .ib.on{color:var(--accent)}
.ar-text{font-family:var(--f-quran);font-size:var(--ar-size);line-height:2.25;direction:rtl;text-align:right;overflow-wrap:break-word}
.vend{font-family:var(--f-quran);color:var(--gold);font-size:.85em;white-space:nowrap}
.tr{font-size:var(--tr-size);line-height:1.75;overflow-wrap:break-word}
.tr.ur{font-family:var(--f-ur);line-height:2.4;text-align:right}
.tr.second{border-top:1px dashed var(--line);padding-top:8px;color:var(--muted)}
.tr-by{font-size:12px;color:var(--muted)}
.wbw{display:flex;flex-wrap:wrap;gap:8px 6px;direction:rtl;align-items:stretch}
.w{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;padding:4px 8px 6px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);cursor:pointer;min-width:46px;max-width:100%}
.w .a{font-family:var(--f-quran);font-size:calc(var(--ar-size)*.92);line-height:1.9}
.w .m{font-size:12px;color:var(--muted);direction:ltr;text-align:center;max-width:9.5em;line-height:1.35;font-family:var(--f-ui)}
.w .m.ur{font-family:var(--f-ur);direction:rtl;font-size:12.5px;line-height:1.95}
.w .tl{font-size:11px;color:var(--accent);font-style:italic;direction:ltr;font-family:var(--f-ui)}
.w.on{border-color:var(--accent);background:var(--hl)}
.wbw .vend{align-self:center;font-size:calc(var(--ar-size)*.8)}
.hz{filter:blur(7px);cursor:pointer;border-radius:6px;transition:filter .15s}
.w.hz{filter:blur(6px)}
.hzt{filter:blur(6px);cursor:pointer;user-select:none}
@media (prefers-reduced-motion:reduce){.hz{transition:none}}
.hzbar{display:flex;flex-direction:column;gap:6px}
.hz-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hz-top b{display:flex;align-items:center;gap:8px;color:var(--ok)}
.hz-meta{font-size:13px;color:var(--muted)}
.hz-acts{display:flex;gap:8px;flex-wrap:wrap}
.more{display:flex;justify-content:center;padding:6px}
.rnav{display:flex;gap:10px}
.rnav .btn{flex:1}
.notice{border-color:var(--warn);background:var(--surface2);font-size:14px}

/* Tafsir */
.tafsir{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.tf-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tf-name{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gold)}
html[lang="ur"] .tf-name{letter-spacing:0;font-size:13px;text-transform:none}
.tf-body{font-size:15px;line-height:1.75;max-height:60vh;overflow-y:auto;padding-inline-end:4px}
.tf-body p{margin:0 0 .7em}
.tf-body[dir="rtl"]{text-align:right}
.tf-body.ur{font-family:var(--f-ur);font-size:16px;line-height:2.35}
.tf-body.ar{font-family:var(--f-ar);font-size:20px;line-height:1.95}
.note{font-size:13px;color:var(--muted)}
.note.err{color:var(--bad)}

/* Hadith */
.hcard{display:flex;flex-direction:column;gap:10px;scroll-margin-top:calc(var(--bar-h) + 14px)}
.hcard.on{border-color:var(--accent);background:var(--hl)}

.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--ink)}

.cmdform{display:flex;gap:8px}

async function getJSON(url){const r=await fetch(url);if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}return r.json()}
async function aq(p){let r;try{r=await fetch(API+p)}catch(e){e.offline=true;throw e}let j=null;try{j=await r.json()}catch(e){}if(!r.ok||!j||j.code!==200){const e=new Error((j&&typeof j.data==="string"&&j.data)||("HTTP "+r.status));e.status=r.status;throw e}return j.data}
let SURAHS=null,SURAHS_P=null;
function surahs(){if(SURAHS)return Promise.resolve(SURAHS);if(!SURAHS_P)SURAHS_P=aq("/surah").then(d=>{SURAHS=d;return d}).catch(e=>{SURAHS_P=null;throw e});return SURAHS_P}
let EDS=null,QARIS=null;
async function validateEditions(){
  try{
    const eds=await editions();const has=id=>eds.some(e=>e.identifier===id);let changed=false;
    if(!has(S.tr1)){const l=edLang(S.tr1);const alt=(has(PREFERRED[l])&&PREFERRED[l])||(eds.find(e=>e.language===l)||{}).identifier||(eds.find(e=>e.language==="ur")||{}).identifier||"en.sahih";S.tr1=alt;changed=true}
    if(S.tr2&&!has(S.tr2)){S.tr2="";changed=true}
    if(changed){save();return true}
  }catch(e){}
  return false;
}
async function editions(){if(EDS)return EDS;EDS=await aq("/edition?format=text&type=translation");return EDS}
async function reciters(){if(QARIS)return QARIS;const a=await aq("/edition?format=audio&language=ar");QARIS=a.filter(e=>e.type==="versebyverse");if(!QARIS.length)QARIS=a;return QARIS}
const HC=new Map();
let HB=0,TB=0;
async function hget(path){
  if(HC.has(path))return HC.get(path);
  let last=null;
  for(let k=0;k<HAPI.length;k++){const bi=(HB+k)%HAPI.length;
    for(const ext of [".min.json",".json"]){
      try{const r=await fetch(HAPI[bi]+path+ext);if(r.ok){const j=await r.json();HC.set(path,j);if(HC.size>8)HC.delete(HC.keys().next().value);HB=bi;return j}last=new Error("HTTP "+r.status);last.status=r.status}catch(e){last=e}
    }
  }
  throw last||new Error("hadith");
}
const tfCache=new Map();
async function fetchTafsir(id,s,a){
  const key=`${id}/${s}/${a}`;if(tfCache.has(key))return tfCache.get(key);
  for(let k=0;k<TAFSIR_SRC.length;k++){const bi=(TB+k)%TAFSIR_SRC.length;try{const r=await fetch(`${TAFSIR_SRC[bi]}${key}.json`);if(r.ok){const j=await r.json();const x=(j&&j.text)||"";tfCache.set(key,x);TB=bi;return x}}catch(e){}}
  throw new Error(t("offlineShort"));
}
const WBWC={};
async function wbwSurah(s,lang){
  const key=s+"|"+lang;if(WBWC[key])return WBWC[key];
  const base=`${QCOM}/verses/by_chapter/${s}?language=${lang}&words=true&word_fields=text_uthmani&per_page=50`;
  const first=await getJSON(base+"&page=1");let verses=first.verses||[];
  const tp=(first.pagination&&first.pagination.total_pages)||1;
  if(tp>1){const rest=await Promise.all(range(2,tp).map(p=>getJSON(base+"&page="+p)));rest.forEach(r=>{verses=verses.concat(r.verses||[])})}
  const map={};verses.forEach(v=>{map[v.verse_number]=wordsOf(v)});
  WBWC[key]=map;return map;
}
const wordsOf=v=>(v.words||[]).filter(w=>w.char_type_name!=="end").map(w=>({ar:w.text_uthmani||w.text||"",m:(w.translation&&w.translation.text)||"",tl:(w.transliteration&&w.transliteration.text)||"",au:w.audio_url||""}));

function setupObservers(){

  IO=new IntersectionObserver(es=>{

    if(!R||!vis.size)return;
    const line=window.innerHeight*0.4;let top=Math.min(...vis),bestD=1e9;
    vis.forEach(i=>{const el=$("#a"+i);if(!el)return;const r=el.getBoundingClientRect();const d=r.top<=line&&r.bottom>=line?0:Math.min(Math.abs(r.top-line),Math.abs(r.bottom-line));if(d<bestD){bestD=d;top=i}});

/* Recitation: Arabic, the recorded translation, or both in turn */
const P={audio:(typeof Audio!=="undefined")?new Audio():null,idx:-1,left:0,on:false,phase:"ar",mode:"ar",single:false,tok:0,tts:false};
const WA=(typeof Audio!=="undefined")?new Audio():null;
const playMode=()=>S.play||"ar";
function mark(i){$$(".ayah.on").forEach(e=>e.classList.remove("on"));P.idx=i;if(i>=0&&R){R.cur=i;renderUpTo(i);const el=$("#a"+i);if(el){el.classList.add("on");try{el.scrollIntoView({behavior:"smooth",block:"center"})}catch(e){}}S.last={s:R.s,a:i+1};save()}}
function playFrom(i,mode,single){
  if(!R)return;ttsStop();if(WA)WA.pause();P.tok++;
  P.mode=mode||playMode();P.single=!!single;P.left=S.rep||1;P.phase=P.mode==="tr"?"tr":"ar";
  step(i);
}
const TRAUD={},TRAUD_NAME={},TAC={};
async function trAudioEdition(l){
  if(Object.prototype.hasOwnProperty.call(TRAUD,l))return TRAUD[l];
  const a=await aq(`/edition?format=audio&language=${encodeURIComponent(l)}`);
  const e=(a||[]).find(x=>x.type==="versebyverse")||null;
  TRAUD[l]=e?e.identifier:null;TRAUD_NAME[l]=e?(e.englishName||e.name||""):"";return TRAUD[l];
}
async function trAudioUrl(s,i){
  if(S.trAudio==="tts")return null;
  let ed=null;try{ed=await trAudioEdition(trLang())}catch(e){return null}
  if(!ed)return null;const k=s+"|"+ed;
  try{if(!TAC[k]){const d=await aq(`/surah/${s}/${ed}`);TAC[k]=(d&&d.ayahs)||[]}}catch(e){return null}
  const x=TAC[k][i];return x&&x.audio?{src:x.audio,alt:(x.audioSecondary||[])[0]||""}:null;
}
function setSrc(src,alt){P.audio.dataset.alt=alt||"";P.audio.src=src;const p=P.audio.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError")toast(t("tapPlay"))})}
function speakTr(i,tok){
  const x=R&&R.tr&&R.tr.ayahs[i];if(!x){stopAll();return}
  if(P.audio)P.audio.pause();P.tts=true;
  const ok=speak(x.text,trLang(),()=>{if(tok===P.tok){P.tts=false;next(i)}});
  if(!ok){P.tts=false;P.tok++;P.on=false;mark(-1)}
  updatePlayer();
}
async function step(i){
  if(!R||!P.audio)return;const tok=P.tok;
  mark(i);P.on=true;P.tts=false;
  if(P.phase==="ar"){
    const a=R.au&&R.au.ayahs[i];if(!a||!a.audio){toast(t("audioFail"));stopAll();return}
    setSrc(a.audio,(a.audioSecondary||[])[0]);updatePlayer();return;
  }
  updatePlayer();
  const u=await trAudioUrl(R.s,i);if(tok!==P.tok||!R)return;
  if(u){setSrc(u.src,u.alt);updatePlayer();return}
  speakTr(i,tok);
}
function next(i){
  if(!R||!P.on)return;
  if(P.phase==="ar"){P.left--;if(P.left>0){P.audio.currentTime=0;P.audio.play().catch(()=>{});return}if(P.mode==="both"){P.phase="tr";step(i);return}}
  if(P.single){stopAll();return}
  if(i<R.ar.ayahs.length-1){P.left=S.rep||1;P.phase=P.mode==="tr"?"tr":"ar";step(i+1)}else stopAll();
}
if(P.audio){
  P.audio.addEventListener("ended",()=>{if(P.on&&!P.tts)next(P.idx)});
  P.audio.addEventListener("error",()=>{
    if(!P.on||P.tts)return;const alt=P.audio.dataset.alt;
    if(alt&&P.audio.src!==alt){P.audio.dataset.alt="";P.audio.src=alt;P.audio.play().catch(()=>{});return}
    if(P.phase==="tr"){speakTr(P.idx,P.tok);return}
    toast(t("audioFail"));P.on=false;updatePlayer();
  });
  P.audio.addEventListener("play",updatePlayer);P.audio.addEventListener("pause",updatePlayer);
}
function stopAll(){P.tok++;P.on=false;P.tts=false;if(P.audio)P.audio.pause();if(WA)WA.pause();ttsStop();mark(-1);updatePlayer()}
const isPlaying=()=>!!(P.on&&(P.tts||(P.audio&&!P.audio.paused)));
function togglePlay(){
  if(!R)return;
  if(isPlaying()){if(P.tts){stopAll();return}P.audio.pause();P.on=false}
  else if(P.audio&&P.audio.src&&P.idx>=0){P.on=true;P.audio.play().catch(()=>{})}
  else playFrom(R.cur||0);
  updatePlayer();
}
function modeLabel(m){const L=langName(trLang());return m==="both"?t("pm_both",{l:L}):m==="tr"?t("pm_tr",{l:L}):t("pm_ar")}
function plInfo(playing){
  const i=R?(P.idx>=0?P.idx:(R.cur||0)):-1;const ref=R&&i>=0?num(R.s+":"+(i+1)):"";
  const q=(QARIS||[]).find(x=>x.identifier===S.qari);const qn=q?q.englishName:"";
  let line;
  if(playing)line=P.phase==="tr"?t("readingTr",{l:langName(trLang())}):(qn?t("reciting")+" · "+qn:t("reciting"));
  else{const m=playMode();line=(qn||t("readyToRecite"))+(m!=="ar"?" · "+modeLabel(m):"")}
  return `<b>${ref}</b><span>${esc(line)}</span>`;
}
function refreshPlInfo(){const el=$("#plInfo");if(el)el.innerHTML=plInfo(isPlaying())}
function updatePlayer(){
  const p=$("#player");if(!p||p.hidden)return;
  const playing=isPlaying();
  p.innerHTML=`<div class="in">
   <button class="ib" data-act="prevV" aria-label="${t("prev")}">${icon("prev","svg flip")}</button>
   <button class="pl-main" data-act="toggle" aria-label="${playing?t("pause"):t("play")}">${icon(playing?"pause":"play")}</button>
   <button class="ib" data-act="nextV" aria-label="${t("next")}">${icon("next","svg flip")}</button>
   <div class="pl-info" id="plInfo">${plInfo(playing)}</div>
   <button class="ib${S.rep>1?" on":""}" data-act="cycleRep" aria-label="${t("repeat")}">${icon("repeat")}<small dir="ltr">${num(S.rep)}×</small></button>
   <button class="ib${P.on&&P.phase==="tr"?" on":""}" data-act="sayCur" aria-label="${t("readTr")}">${icon("speak")}</button>
   <button class="ib" data-act="stop" aria-label="${t("stop")}">${icon("stop")}</button></div>`;
  measure();
}

/* Read aloud with the phone's own voice (used when there is no recording) */
let TTS_TOK=0;
function ttsStop(){TTS_TOK++;try{if(TTS)TTS.cancel()}catch(e){}}
function voiceFor(l){try{return TTS.getVoices().find(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith(l))||null}catch(e){return null}}
function hasVoice(l){if(!TTS)return false;let v=[];try{v=TTS.getVoices()}catch(e){}if(!v.length)return null;return !!voiceFor(l)}
function chunks(text){
  const parts=String(text).replace(/([.!?۔؟])\s+/g,"$1\n").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out=[];let cur="";
  for(let p of parts){while(p.length>300){const c=p.lastIndexOf(" ",300)>100?p.lastIndexOf(" ",300):300;out.push(p.slice(0,c));p=p.slice(c).trim()}if(cur&&(cur+" "+p).length>220){out.push(cur);cur=p}else cur=cur?cur+" "+p:p}
  if(cur)out.push(cur);return out;
}
function speak(text,l,onDone){
  if(!TTS){toast(t("noTTS"),5000);return false}
  if(hasVoice(l)===false&&l!=="en"){toast(t("ttsNoVoice",{l:langName(l)}),8000);return false}
  ttsStop();const tok=TTS_TOK;const v=voiceFor(l);
  const list=chunks(text);if(!list.length){if(onDone)setTimeout(onDone,0);return true}
  list.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p);u.lang=v?v.lang:l;if(v)u.voice=v;if(k===list.length-1)u.onend=()=>{if(tok===TTS_TOK&&onDone)onDone()};try{TTS.speak(u)}catch(e){}});
  return true;
}

  if(n===2)return LET.map(([c,an,un,en,j])=>({d:c,s:an,l:ur?un:en,f:c==="ء"?[c,c,c,c]:j?[c,c+ZWJ,ZWJ+c+ZWJ,ZWJ+c]:[c,c,ZWJ+c,ZWJ+c]}));
  const out=[];
  const V=[["fatha","a","زبر"],["kasra","i","زیر"],["damma","u","پیش"]];
  LET.forEach(([c,an,un,en])=>{
    const tl=TLIT[c];
    if(n===3){V.forEach(([h,v,uv])=>{const d=c+HK[h];const s=c===ALIF?(h==="kasra"?AHK:AHF)+HK[h]:d;out.push({d,s,l:ur?`${un} ${uv}`:(tl||"")+v})});return}
    if(c===ALIF)return;
    if(n===4){[["fathatan","an","دو زبر"],["kasratan","in","دو زیر"],["dammatan","un","دو پیش"]].forEach(([h,v,uv])=>{const d=c+HK[h];out.push({d,s:d,l:ur?`${un} ${uv}`:tl+v})});return}
    if(c==="ء")return;
    if(n===5){[[HK.fatha+"ا","ā","زبر الف"],[HK.kasra+"ي"+HK.sukun,"ī","زیر یے"],[HK.damma+"و"+HK.sukun,"ū","پیش واؤ"]].forEach(([x,v,uv])=>{const d=c+x;out.push({d,s:d,l:ur?`${un} ${uv}`:tl+v})});return}
    if(n===6){[["fatha","a","زبر"],["kasra","i","زیر"],["damma","u","پیش"]].forEach(([h,v,uv])=>{const d=ALIF+HK[h]+c+HK.sukun;const s=(h==="kasra"?AHK:AHF)+HK[h]+c+HK.sukun;out.push({d,s,l:ur?`${uv}، ${un} جزم`:v+tl})});return}
    if(n===7){[["fatha","a","زبر"],["kasra","i","زیر"],["damma","u","پیش"]].forEach(([h,v,uv])=>{const d=ALIF+HK[h]+c+HK.shadda+HK[h];const s=(h==="kasra"?AHK:AHF)+HK[h]+c+HK.shadda+HK[h];out.push({d,s,l:ur?`${un} تشدید ${uv}`:v+tl+tl+v})});return}
  });
  return out;
}

async function makeQ(kind){
  const list=await surahs();
  if(kind==="surahMeta")kind=pick(["makki","count"]);
  if(kind==="surah")kind=pick(["first","first","makki","count"]);
  const sShort=m=>isUr()?arShort(m.name):m.englishName;
  if(kind==="makki"){const m=pick(list);return {prompt:t("qMakki",{name:sShort(m)}),body:"",opts:[t("meccan"),t("medinan")],ans:m.revelationType==="Medinan"?1:0}}
  if(kind==="count"){const m=pick(list);const set=new Set([m.numberOfAyahs]);while(set.size<4){const x=pick(list).numberOfAyahs;set.add(x)}const opts=shuffle([...set]);return {prompt:t("qCount",{name:sShort(m)}),body:"",opts:opts.map(x=>num(x)),ans:opts.indexOf(m.numberOfAyahs)}}
  if(kind==="first"){
    const m=pick(list.filter(x=>x.numberOfAyahs>=3));const a=m.number===1?2:1;
    const d=await aq(`/ayah/${m.number}:${a}/editions/quran-uthmani,${S.tr1}`);
    let ar=stripBism(d[0].text,m.number,a-1);let useA=a;
    if(plainAr(ar).replace(/\s/g,"").length<10){const d2=await aq(`/ayah/${m.number}:${a+1}/editions/quran-uthmani,${S.tr1}`);ar=d2[0].text;d[1]=d2[1];useA=a+1}
    const others=shuffle(list.filter(x=>x.number!==m.number)).slice(0,3);const opts=shuffle([m].concat(others));const L=edLang(S.tr1);
    return {prompt:t("qWhichSurah"),body:`<div class="qbody"><div class="ar-text" lang="ar">${esc(ar)} <span class="vend">${vend(useA)}</span></div><div class="tr${L==="ur"?" ur":""}" dir="${dirOf(L)}" lang="${L}">${esc(d[1].text)}</div></div>`,opts:opts.map(x=>sShort(x)),ans:opts.indexOf(m)};
  }
  if(kind==="words"){
    const sN=78+rnd(37),m=list[sN-1],a=1+rnd(m.numberOfAyahs);
    const j=await getJSON(`${QCOM}/verses/by_key/${sN}:${a}?language=${S.wbwLang||(isUr()?"ur":"en")}&words=true&word_fields=text_uthmani`);
    const words=wordsOf(j.verse||{}).filter(w=>w.m&&w.ar);if(words.length<2)throw new Error("few");
    const target=pick(words);const pool=new Set([target.m]);shuffle(words).forEach(w=>{if(pool.size<4)pool.add(w.m)});
    if(pool.size<4){try{const k=await getJSON(`${QCOM}/verses/by_key/${sN}:${a===1?2:a-1}?language=${S.wbwLang||(isUr()?"ur":"en")}&words=true&word_fields=text_uthmani`);shuffle(wordsOf(k.verse||{})).forEach(w=>{if(w.m&&pool.size<4)pool.add(w.m)})}catch(e){}}
    if(pool.size<4)throw new Error("few");
    const opts=shuffle([...pool]);const urM=(S.wbwLang||(isUr()?"ur":"en"))==="ur";
    return {prompt:t("qWord"),body:`<div class="qbody"><div class="qword" lang="ar">${esc(target.ar)}</div><p class="muted" style="margin:0;text-align:center">${esc(surahName(m))} · ${num(sN+":"+a)}</p></div>`,opts,ans:opts.indexOf(target.m),optUr:urM};
  }
  if(kind==="hadith"){
    const books=["bukhari","muslim","abudawud","tirmidhi","nasai","ibnmajah","malik"];
    const b=pick(books);const n=1+rnd(HIDX[b].last);const x=await hadithOne(b,n);
    if(!x.h.text||x.h.text.length<40)throw new Error("short");
    const opts=shuffle([b].concat(shuffle(books.filter(y=>y!==b)).slice(0,3)));
    return {prompt:t("qBook"),body:`<div class="qbody"><div class="h-tr${x.L==="ur"?" ur":""}" dir="${dirOf(x.L)}" lang="${x.L}">${esc(clip(x.h.text,320))}</div></div>`,opts:opts.map(bookName),ans:opts.indexOf(b),link:`#/hadith/${b}/n/${x.h.hadithnumber}`};
  }
  throw new Error("kind");
}

function norm(s){
  s=plain(s);
  s=s.replace(ALEFS,"ا").replace(YEHS,"ي").replace(KEHEH,"ك").replace(HEHS,"ه");
  s=s.replace(/(^|\s)(surah|sura|surat|soorah|سوره|سورت)(?=\s|$)/g," ");
  s=s.replace(/\b(al|an|ar|as|at|ad|adh|az|ash|ath|aal)[-\s]/g,"");
  s=s.replace(/(^|\s)ال/g,"$1");
  s=s.replace(NONWORD,"");
  return s.replace(/ee/g,"i").replace(/oo/g,"u").replace(/(.)\1+/g,"$1").replace(/h$/,"");
}
const ALIAS_N=Object.keys(ALIASES).map(k=>[norm(k),ALIASES[k]]);
function lev(a,b){const m=[];for(let j=0;j<=b.length;j++)m[j]=j;for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const x=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=x}}return m[b.length]}
function findSurah(q,list){
  const n=norm(q);if(n.length<2)return null;
  for(const [k,v] of ALIAS_N)if(k===n)return v;
  for(const [k,v] of ALIAS_N)if(k.length>=4&&n.includes(k))return v;
  if(!list)return null;let best=null,bd=99;
  for(const s of list)for(const k of [norm(s.englishName),norm(s.englishNameTranslation||""),norm(s.name||"")]){if(!k)continue;if(k===n)return [s.number];const d=lev(n,k);if(d<bd){bd=d;best=s.number}}
  return best&&bd<=Math.max(1,Math.floor(n.length/4))?[best]:null;
}
function matchHadithBook(q){
  let s=q.replace(/(^|\s)(hadith|hadees|حدیث|book|کتاب|of|کی)(?=\s|$)/g," ").replace(/\s+/g," ").trim();
  for(const b of HORDER){for(const al of HBOOKS[b].al){const a=al.toLowerCase();if(s===a||s.startsWith(a+" ")){const rest=s.slice(a.length).trim();const m=rest.match(/(\d{1,4})/);if(rest&&!m&&!/^(number|no|نمبر)$/.test(rest))continue;return {b,n:m?+m[1]:null}}}}
  return null;
}
async function run(raw){

  if(/^(stop|pause|ruko|رکو|رکیں|بند|بند کرو|بس)$/.test(q)){stopAll();hideOverlays();return closeAll()}
  const NAV=[[/^(home|ہوم|گھر)$/,"#/"],[/^(quran|قرآن|قران|surahs|سورتیں)$/,"#/quran"],[/^(paras?|juz|پارے|سپارے)$/,"#/quran/juz"],[/^(hadith|ahadith|hadees|حدیث|احادیث)$/,"#/hadith"],[/^(qaida|qaidah|قاعدہ|قاعده)$/,"#/qaida"],[/^(quiz|کوئز|امتحان)$/,"#/quiz"],[/^(hifz|memorize|memorise|حفظ)$/,"#/hifz"],[/^(bookmarks?|بک مارکس?)$/,"#/bookmarks"],[/^(settings|ترتیبات|سیٹنگز|سیٹنگ)$/,"#/settings"],[/^(word by word|wbw|لفظ بہ لفظ)$/,"#/wbw"]];

  m=q.match(/^(?:para|parah|sipara|juz|juzz|پارہ|پاره|سپارہ|سیپارہ|جز)\s*(?:number|no|نمبر)?\s*(\d{1,2})$/);
  if(m&&+m[1]>=1&&+m[1]<=30){const j=JUZ[+m[1]-1];return go(`#/s/${j[0]}/${j[1]}`)}
  const hb=matchHadithBook(q);if(hb)return go(hb.n?`#/hadith/${hb.b}/n/${hb.n}`:`#/hadith/${hb.b}`);
  if(/^(read|speak|say)( the)?( translation| it| aloud)?$|^(ترجمہ|ترجمه)( سنائیں| سناؤ| پڑھیں)?$/.test(q)){closeAll();if(VIEW.name==="reader"&&R)playFrom(R.cur||0,"tr");return}

  if(/^(previous|prev|back|پچھلی|پچھلا)( surah| سورت| سورہ)?$/.test(q))return go(`#/s/${Math.max(1,curS-1)}`);
  const TAF=/(^|\s)(tafsir|tafseer|tafsiir|explain|explanation|meaning|تفسیر|تفسير)(?=\s|$)/;
  const PLAY=/(^|\s)(play|recite|listen to|listen|tilawat|tilawah|تلاوت|سنائیں|سناؤ)(?=\s|$)/;

  if(!q){if(VIEW.name==="reader"&&R){closeAll();if(wantT)showTafsir(R.cur||0,true);if(wantP)playFrom(R.cur||0);return}return act(S.last.s,S.last.a)}
  const lw=q.replace(/(^|\s)(change|switch|show|set|translation|translations|language|in|to|into|mein|میں|ترجمہ|ترجمه)(?=\s|$)/g," ").trim();

  if(m&&+m[1]>=1&&+m[1]<=114)return act(+m[1],+m[2]);
  const AY=/(?:verse|ayah|ayat|aayat|aya|ayet|آیت|آیة|ايت|آيت)\s*(?:number|no|نمبر)?\s*(\d{1,3})/;

document.addEventListener("input",e=>{
  const el=e.target.closest("[data-live]");if(!el)return;const k=el.dataset.live;
  if(k==="filter"){const q=plain(asciiDigits(el.value.trim()));$$("#list .row").forEach(r=>{r.hidden=!!q&&!(r.dataset.f||"").includes(q)});return}
  if(k==="arSize"||k==="trSize"){S[k]=+el.value;applySizes();const b=$("#"+k+"V");if(b)b.textContent=num(S[k]);save()}
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  if(f.dataset.form==="cmd"){const i=$("#cmdIn");if(i){i.blur();run(i.value)}}
  if(f.dataset.form==="goto"){const n=parseInt(asciiDigits($("#gotoN").value),10);if(n>0)go(`#/hadith/${f.dataset.b}/n/${n}`)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(DRAWER||SHEET))closeAll()});

/* ======================================================================
   Install as an app, and keep opened content for offline use
   ====================================================================== */
let installEvt=null;
function isInstalled(){try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}}
function updateInstallUi(){const d=$("#drInstall");if(d)d.hidden=!installEvt;const s=$("#setInstall");if(s)s.hidden=!installEvt;renderInstallSlot()}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();if(isInstalled())return;installEvt=e;updateInstallUi()});
window.addEventListener("appinstalled",()=>{installEvt=null;updateInstallUi();toast(t("installed"),4000)});
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}

/* ======================================================================
   Start
   ====================================================================== */
applyTheme();applySizes();
if(!S.ui){
  document.documentElement.lang="en";
  $("#welcome").innerHTML=`<div class="wl"><img src="icon-192.png" width="96" height="96" alt=""><h1>Noor Quran <span lang="ar">نور</span></h1><p>Choose app language<br><span class="ur" lang="ur">ایپ کی زبان منتخب کریں</span></p><div class="wl-btns"><button class="btn pri ur" data-act="welcome" data-v="ur" lang="ur">اردو</button><button class="btn" data-act="welcome" data-v="en">English</button></div></div>`;
  $("#welcome").hidden=false;
}else{uiDefaults();applyUi();route()}
validateEditions().then(ch=>{if(ch&&VIEW.name==="reader")route()});
measure();
window.NoorQuran={run,state:S,go,get R(){return R}};
})();
</script>
</body>
</html>
